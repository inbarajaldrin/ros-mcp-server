name: fmb1_continuous
description: "Ablation 1: Continuous execution Phase 1-3 sim, no context clearing (fmb1, sonnet)"
created: 2026-02-23T00:00:00.000Z
runs: 5
models:
  - provider: anthropic
    model: claude-sonnet-4-6
settings:
  mcpConfigPath: /home/aaugus11/Documents/mcp-client-example/mcp_config.json
  maxIterations: 150
  clearContextBetweenPhases: false
systemPrompt: "@insert-prompt:Prompts__system_context"
hooks:
  - before: isaac-sim__restore_scene_state
    run: "@tool-exec:ros-mcp-server__move_home(mode='sim')"
phases:
  - name: Disassembly sequence discovery
    onStart:
      - "@tool-exec:ros-mcp-server__move_home(mode='sim')"
      - "@tool-exec:isaac-sim__delete_objects()"
      - "@tool-exec:isaac-sim__play_scene()"
      - "@tool-exec:ros-mcp-server__control_gripper(command='open', mode='sim')"
      - "@tool-exec:isaac-sim__add_objects(assembly='fmb1')"
      - "@tool-exec:isaac-sim__setup_pose_publisher()"
      - "@wait:1"
      - "@tool-exec:isaac-sim__assemble_objects(assembly='fmb1')"
      - "@insert-resource:Resources__assembly_objects(assembly_id='fmb_assembly_1')"
    commands:
      - "@insert-prompt:Prompts__phase_1_disassembly_sequence_discovery(grasp_hint='enabled')"
      - "@insert-attachment:fmb_assembly1_manual.png"
    hooks:
      - after: ros-mcp-server__verify_disassembly
        run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 1
          status: success
        run: "@complete-phase"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 1
          status: failure
          requires_response: false
        run: "@abort"

  - name: Assembly sequence discovery
    onStart:
      - "@tool-exec:isaac-sim__randomize_object_poses()"
      - "@insert-resource:Resources__assembly_objects(assembly_id='fmb_assembly_1')"
      - "@insert-resource:Resources__results_resource(assembly_id='fmb_assembly_1', task_type='disassembly')"
    commands:
      - "@insert-prompt:Prompts__phase_2_assembly_sequence_discovery"
      - "@insert-attachment:fmb_assembly1_manual.png"
    hooks:
      - after: ros-mcp-server__verify_assembly
        run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 2
          status: success
        run: "@complete-phase"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 2
          status: failure
          requires_response: false
        run: "@abort"

  - name: Assembly execution (sim)
    onStart:
      - "@tool-exec:isaac-sim__randomize_object_poses()"
      - "@insert-resource:Resources__assembly_objects(assembly_id='fmb_assembly_1')"
      - "@insert-resource:Resources__results_resource(assembly_id='fmb_assembly_1', task_type='assembly')"
    commands:
      - "@insert-prompt:Prompts__phase_3_perform_assembly(mode='sim')"
      - "@insert-attachment:fmb_assembly1_manual.png"
    hooks:
      - after: ros-mcp-server__verify_assembly
        run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 3
          status: success
        run: "@complete-phase"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 3
          status: failure
          requires_response: false
        run: "@abort"
