      - "@tool-exec:ros-mcp-server__translate_object(action='perform_insert', base_name='base1', mode='sim', object_name='u_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35', mode='sim')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_to_safe_height', mode='sim', object_name='u_brown')"
