name: fmb1-dry
description: "FMB1 disassembly + assembly (dry run). Phase 1: disassembly. Phase 2: assembly (move_away_from_base, no move_to_regrasp)."
created: 2026-02-19T10:00:00.000Z
dryRun: true
runs: 1
models: []
settings:
  maxIterations: -1
phases:
  - name: disassembly
    enabled: true
    onStart:
      - "@tool-exec:ros-mcp-server__move_home(mode='real')"
      - "@tool-exec:isaac-sim__delete_objects()"
      - "@tool-exec:isaac-sim__play_scene()"
      - "@tool-exec:isaac-sim__add_objects(assembly='fmb1')"
      - "@tool-exec:isaac-sim__setup_pose_publisher()"
      - "@tool-exec:isaac-sim__assemble_objects(assembly='fmb1')"
      - "@tool-exec:isaac-sim__save_scene_state()"
    commands:
      # inverted_u_yellow (grasp_id=2, gripper_width_mm=56.7)
      - "@tool-exec:ros-mcp-server__control_gripper(command='56.7', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=2, mode='sim', object_name='inverted_u_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=2, mode='sim', object_name='inverted_u_yellow')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_away_from_base', mode='sim', object_name='inverted_u_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='56.7', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base1', object_name='inverted_u_yellow')"
      # line_green (grasp_id=1, gripper_width_mm=39.8)
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=1, mode='sim', object_name='line_green')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=1, mode='sim', object_name='line_green')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_away_from_base', mode='sim', object_name='line_green')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base1', object_name='line_green')"
      # u_orange (grasp_id=1, gripper_width_mm=35.0)
      - "@tool-exec:ros-mcp-server__control_gripper(command='35', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=1, mode='sim', object_name='u_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=1, mode='sim', object_name='u_orange')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_away_from_base', mode='sim', object_name='u_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base1', object_name='u_orange')"
      # u_brown (grasp_id=1, gripper_width_mm=35.0)
      - "@tool-exec:ros-mcp-server__control_gripper(command='35', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=1, mode='sim', object_name='u_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=1, mode='sim', object_name='u_brown')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_away_from_base', mode='sim', object_name='u_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base1', object_name='u_brown')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base1', check_all=True)"
  - name: assembly
    enabled: true
    onStart:
      - "@tool-exec:ros-mcp-server__move_home(mode='sim')"
      - "@tool-exec:isaac-sim__randomize_object_poses()"
