name: fmb3-dry
description: "FMB3 disassembly + assembly (dry run). Phase 1: disassembly. Phase 2: assembly (place_down for regrasp, insert for insertion)."
created: 2026-02-19T10:02:00.000Z
dryRun: true
runs: 1
models: []
settings:
  maxIterations: -1
hooks:
  - before: isaac-sim__restore_scene_state
    run: "@tool-exec:ros-mcp-server__move_home(mode='sim')"
phases:
  - name: Disassembly sequence discovery
    onStart:
      - "@tool-exec:ros-mcp-server__move_home(mode='sim')"
      - "@tool-exec:isaac-sim__delete_objects()"
      - "@tool-exec:isaac-sim__play_scene()"
      - "@tool-exec:ros-mcp-server__control_gripper(command='open', mode='sim')"
      - "@tool-exec:isaac-sim__add_objects(assembly='fmb3')"
      - "@tool-exec:isaac-sim__setup_pose_publisher()"
      - "@wait:1"
      - "@tool-exec:isaac-sim__assemble_objects(assembly='fmb3')"
    commands:
      # fork_yellow (grasp_id=4, gripper_width_mm=35.1)
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=4, mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__translate_object(action='place_down', base_name='base3', mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', object_name='fork_yellow')"
      # fork_orange (grasp_id=4, gripper_width_mm=35.1)
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=4, mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__translate_object(action='place_down', base_name='base3', mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', object_name='fork_orange')"
      # line_red (grasp_id=1, gripper_width_mm=39.8)
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=1, mode='sim', object_name='line_red')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__translate_object(action='place_down', base_name='base3', mode='sim', object_name='line_red')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', object_name='line_red')"
      # line_brown (grasp_id=1, gripper_width_mm=39.8)
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=1, mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__translate_object(action='place_down', base_name='base3', mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', object_name='line_brown')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', check_all=True)"
    hooks:
      - after: ros-mcp-server__verify_disassembly
        run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"

  - name: Assembly sequence discovery
    onStart:
      - "@tool-exec:ros-mcp-server__move_home(mode='sim')"
      - "@tool-exec:isaac-sim__delete_objects()"
      - "@tool-exec:isaac-sim__play_scene()"
      - "@tool-exec:ros-mcp-server__control_gripper(command='open', mode='sim')"
      - "@tool-exec:isaac-sim__add_objects(assembly='fmb3')"
      - "@tool-exec:isaac-sim__setup_pose_publisher()"
      - "@wait:1"
      - "@tool-exec:isaac-sim__assemble_objects(assembly='fmb3')"
      - "@tool-exec:isaac-sim__randomize_object_poses()"
    commands:
      # line_brown (grasp_id=1, gripper_width_mm=39.8) - no regrasp needed for line
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=1, mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__rotate_object(base_name='base3', mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__translate_object(action='insert', base_name='base3', mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_assembly(base_name='base3', object_name='line_brown')"
      # line_red (grasp_id=1, gripper_width_mm=39.8) - no regrasp needed for line
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=1, mode='sim', object_name='line_red')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__rotate_object(base_name='base3', mode='sim', object_name='line_red')"
      - "@tool-exec:ros-mcp-server__translate_object(action='insert', base_name='base3', mode='sim', object_name='line_red')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_assembly(base_name='base3', object_name='line_red')"
      # fork_orange (grasp_id=4, gripper_width_mm=35.1) - first grasp + rotate + regrasp
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=4, mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__rotate_object(base_name='base3', mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__translate_object(action='place_down', base_name='base3', mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=4, mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__rotate_object(base_name='base3', mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__translate_object(action='insert', base_name='base3', mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_assembly(base_name='base3', object_name='fork_orange')"
      # fork_yellow (grasp_id=4, gripper_width_mm=35.1) - first grasp + rotate + regrasp
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=4, mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__rotate_object(base_name='base3', mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__translate_object(action='place_down', base_name='base3', mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(grasp_id=4, mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      - "@tool-exec:ros-mcp-server__rotate_object(base_name='base3', mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__translate_object(action='insert', base_name='base3', mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_safe_height(mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_assembly(base_name='base3', object_name='fork_yellow')"
      # - "@tool-exec:ros-mcp-server__verify_assembly(base_name='base3', check_all=True)"
      - "@tool-exec:ros-mcp-server__move_home(mode='sim')"
    hooks:
      - after: ros-mcp-server__verify_assembly
        run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"
