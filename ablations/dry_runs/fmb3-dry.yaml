name: fmb3-dry
description: "FMB3 disassembly + assembly (dry run). Phase 1: disassembly. Phase 2: assembly (move_away_from_base, no move_to_regrasp)."
created: 2026-02-19T10:02:00.000Z
dryRun: true
runs: 1
models: []
settings:
  maxIterations: -1
phases:
  - name: disassembly
    enabled: true
    onStart:
      - "@tool-exec:ros-mcp-server__move_home(mode='real')"
      - "@tool-exec:isaac-sim__delete_objects()"
      - "@tool-exec:isaac-sim__play_scene()"
      - "@tool-exec:isaac-sim__add_objects(assembly='fmb3')"
      - "@tool-exec:isaac-sim__setup_pose_publisher()"
      - "@tool-exec:isaac-sim__assemble_objects(assembly='fmb3')"
      - "@tool-exec:isaac-sim__save_scene_state()"
    commands:
      # fork_yellow (grasp_id=4, gripper_width_mm=35.1)
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=4, mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=4, mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_away_from_base', mode='sim', object_name='fork_yellow')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', object_name='fork_yellow')"
      # fork_orange (grasp_id=4, gripper_width_mm=35.1)
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=4, mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=4, mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_away_from_base', mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='35.1', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', object_name='fork_orange')"
      # line_red (grasp_id=1, gripper_width_mm=39.8)
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=1, mode='sim', object_name='line_red')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=1, mode='sim', object_name='line_red')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_away_from_base', mode='sim', object_name='line_red')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', object_name='line_red')"
      # line_brown (grasp_id=1, gripper_width_mm=39.8)
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=1, mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=1, mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_away_from_base', mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', object_name='line_brown')"
      # - "@tool-exec:ros-mcp-server__verify_disassembly(base_name='base3', check_all=True)"
  - name: assembly
    enabled: true
    onStart:
      - "@tool-exec:ros-mcp-server__move_home(mode='sim')"
      - "@tool-exec:isaac-sim__delete_objects()"
      - "@tool-exec:isaac-sim__play_scene()"
      - "@tool-exec:ros-mcp-server__control_gripper(command='open', mode='sim')"
      - "@tool-exec:isaac-sim__add_objects(assembly='fmb3')"
      - "@tool-exec:isaac-sim__setup_pose_publisher()"
      - "@wait:1"
      - "@tool-exec:isaac-sim__assemble_objects(assembly='fmb3')"
      - "@tool-exec:isaac-sim__randomize_object_poses()"
