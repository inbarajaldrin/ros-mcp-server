      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=4, mode='sim', object_name='fork_orange')"
      - "@tool-exec:ros-mcp-server__rotate_object(base_name='base3', mode='sim', object_name='fork_orange')"
