      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_object', grasp_id=1, mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='close', mode='sim')"
      - "@tool-exec:ros-mcp-server__move_to_grasp(action='move_to_safe_height', grasp_id=1, mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__rotate_object(base_name='base3', mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_to_base', base_name='base3', mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__translate_object(action='perform_insert', base_name='base3', mode='sim', object_name='line_brown')"
      - "@tool-exec:ros-mcp-server__control_gripper(command='39.8', mode='sim')"
      - "@tool-exec:ros-mcp-server__translate_object(action='move_to_safe_height', mode='sim', object_name='line_brown')"
      # - "@tool-exec:ros-mcp-server__verify_assembly(base_name='base3', object_name='line_brown')"
