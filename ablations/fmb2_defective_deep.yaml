name: fmb2_defective_deep
description: "Main: Phase 3 sim with defective part replacement — deep object u_green (order 1, fmb2)"
created: 2026-02-23T00:00:00.000Z
runs: 3
models:
  - provider: anthropic
    model: claude-sonnet-4-6
settings:
  mcpConfigPath: /home/aaugus11/Documents/mcp-client-example/mcp_config.json
  maxIterations: -1
hooks:
  - before: isaac-sim__restore_scene_state
    run: "@tool-exec:ros-mcp-server__move_home()"
phases:
  - name: Assembly execution (sim) + defective part replacement (deep)
    onStart:
      - "@tool-exec:isaac-sim__randomize_object_poses()"
    commands:
      - "@insert-prompt:Prompts__phase_3_perform_assembly(mode='sim')"
      - "@insert-attachment:fmb_assembly2_manual.png"
      - "@insert-attachment:Disassembly_fmb_assembly_2_results.json"
      - "@insert-attachment:Assembly_fmb_assembly_2_results.json"
    hooks:
      - after: ros-mcp-server__verify_assembly
        run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"
      - after: ros-mcp-server__verify_assembly
        whenOutput:
          result: success
          object_name: hex_red
        run: "@insert-prompt:Prompts__replace_defective_part(object_name='u_green', base_name='base2')"
      - after: ros-mcp-server__signal_operator
        whenInput:
          message: "*"
        gate:
          run: "@tool-exec:ros-mcp-server__verify_disassembly(object_name='u_green', base_name='base2', mode='sim')"
          whenOutput:
            result: success
          onPass:
            - "@tool-exec:isaac-sim__randomize_single_object(object_name='u_green')"
            - "@insert-prompt:The defective part u_green has been replaced. Continue with assembly."
          onFail:
            - "@insert-prompt:u_green has not been disassembled yet. Disassemble it and signal the operator again."
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 3
          status: success
        run: "@complete-phase"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 3
          status: failure
        run: "@abort"
