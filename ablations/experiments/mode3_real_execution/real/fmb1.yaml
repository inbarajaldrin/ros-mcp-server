name: mode3_real_fmb1
description: "Mode 3: Real-world assembly execution using GT sequences (fmb1)"
created: 2026-03-15T00:00:00.000Z
runs: 1
models:
  - provider: anthropic
    model: claude-sonnet-4-6
settings:
  mcpConfigPath: /home/aaugus11/Documents/mcp-client-example/mcp_config.json
  maxIterations: 200
  clearContextBetweenPhases: true
systemPrompt: "@insert-prompt:Prompts__system_context"
phases:
  - name: Assembly execution (real)
    tools:
      deny:
        - mcp-tools-orchestrator__execute_composed_code
        - isaac-sim__save_scene_state
        - isaac-sim__restore_scene_state
    onStart:
      - "@insert-resource:Resources__assembly_objects(assembly_id='fmb_assembly_1')"
      - "@insert-resource:Resources__ground_truth_resource(assembly_id='fmb_assembly_1', task_type='disassembly')"
      - "@insert-resource:Resources__ground_truth_resource(assembly_id='fmb_assembly_1', task_type='assembly')"
    commands:
      - "@insert-prompt:Prompts__phase_3_perform_assembly(mode='real')"
      - "@insert-attachment:fmb_assembly1_manual.png"
    hooks:
      - after: ros-mcp-server__verify_assembly
        run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_real')"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 3
          status: success
        run: "@complete-phase"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 3
          status: failure
          requires_response: false
        run: "@abort"
