name: mode1_p2gate_fmb2_gemini
description: "Isolated P2 (assembly-sequence discovery) for fmb2 WITH the orchestrator-replay verification gate. Phase-1 disassembly is pre-injected as GROUND-TRUTH (ground_truth_resource, so P1 need not run). Single phase => the run EXITS after P2, so the gate-fail -> @switch/@escalate model transition is observable cheaply. Remap (mcp_config_remap.json, sim-executing). Bisected from mode2_openai_fmb2_sim, keeping its P2 gate verbatim. GEMINI escalation chain (gemini-2.5-flash -> gemini-2.5-pro) instead of the GPT chain."
created: "2026-06-06T00:00:00.000Z"
runs: 1
escalation: true
models:
- provider: google
  model: gemini-2.5-flash
- provider: google
  model: gemini-2.5-pro
settings:
  mcpConfigPath: /home/aaugus11/Documents/mcp-client-example/mcp_config_remap.json
  maxIterations: 100
  clearContextBetweenPhases: true
systemPrompt: "@insert-prompt:Prompts__system_context"
hooks:
- before: isaac-sim__restore_scene_state
  run: "@tool-exec:ros-mcp-server__move_home(mode='sim')"
phases:
- name: Assembly sequence discovery
  tools:
    deny:
    - mcp-tools-orchestrator__execute_composed_code
  onStart:
  - "@tool-exec:ros-mcp-server__set_task_phase(phase='assembly')"
  - "@tool-exec:isaac-sim__new_stage()"
  - "@wait:0.5"
  - "@tool-exec:isaac-sim__quick_start()"
  - "@tool-exec:ros-mcp-server__move_home(mode='sim')"
  - "@tool-exec:ros-mcp-server__control_gripper(command='open', mode='sim')"
  - "@tool-exec:isaac-sim__add_objects(assembly='fmb2')"
  - "@tool-exec:isaac-sim__setup_pose_publisher()"
  - "@wait:1"
  - "@tool-exec:isaac-sim__randomize_object_poses()"
  - "@insert-resource:Resources__assembly_objects(assembly_id='fmb_assembly_2')"
  # P1 stand-in: GROUND-TRUTH disassembly order (vs results_resource in the full pipeline)
  - "@insert-resource:Resources__ground_truth_resource(assembly_id='fmb_assembly_2', task_type='disassembly')"
  commands:
  - "@insert-prompt:Prompts__phase_2_assembly_sequence_discovery"
  - "@insert-attachment:fmb_assembly2_manual.png"
  hooks:
  - after: ros-mcp-server__verify_assembly
    run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"
  # --- pre-gate: snapshot the assembled scene, then re-stage scattered for the deterministic replay ---
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    run: "@tool-exec:isaac-sim__save_scene_state(json_file_path='pre_gate_assembled.json')"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    run: "@tool-exec:isaac-sim__new_stage()"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    run: "@wait:0.5"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    run: "@tool-exec:isaac-sim__quick_start()"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    run: "@tool-exec:isaac-sim__add_objects(assembly='fmb2')"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    run: "@tool-exec:isaac-sim__setup_pose_publisher()"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    run: "@wait:1"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    run: "@tool-exec:isaac-sim__randomize_object_poses()"
  # --- the orchestrator-replay gate (verbatim from mode2_openai_fmb2_sim P2) ---
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: success
    gate:
      run: '@tool-exec:mcp-tools-orchestrator__execute_composed_code(code=''from unified_api import *; exec(open(os.path.join(os.environ["ROS_MCP_SERVER_DIR"], "ablations", "replay_verify.py")).read()); setup_and_replay("fmb_assembly_2", "base2", "sim", 2)'')'
      whenOutput:
        status: success
      onPass:
      - '@complete-phase'
      onFail:
      - '@tool-exec:isaac-sim__restore_scene_state(json_file_path=''pre_gate_assembled.json'')'
      - '@switch'
      prompt: The previous model physically assembled the parts, but the tool_sequence it logged does not replay deterministically. {{gate_output}} You are a stronger model continuing with full access to the prior conversation. Using the actual steps performed in that history, write the corrected, complete tool_sequence for each object using write_assembly_results (log only steps that moved the robot), then signal phase 2 complete. Do NOT re-assemble.
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: failure
      action: switch
    run: "@switch"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 2
      status: failure
      requires_response: false
    run: "@escalate"
