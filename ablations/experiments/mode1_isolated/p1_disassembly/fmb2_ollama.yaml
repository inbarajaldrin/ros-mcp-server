name: mode1_p1_fmb2_ollama
description: "Isolated P1 (disassembly-sequence discovery) for fmb2 — OLLAMA escalation chain (qwen3:8b -> qwen3:30b) served remotely from dual-a4500. Single phase, escalate on failure. Remap (mcp_config_remap.json, sim-executing), orchestrator denied. Cloned from fmb2.yaml (mode1_p1_fmb2) but as a cascade (runs:1, escalation:true) instead of the 6-model comparison matrix; onStart gains set_task_phase(phase='disassembly') to match the canonical mode2 P1. NOTE: run with OLLAMA_HOST=http://dual-a4500:11434 and OLLAMA_MAX_CONTEXT>=32768."
created: "2026-06-06T00:00:00.000Z"
runs: 1
escalation: true
models:
- provider: ollama
  model: qwen3:8b
- provider: ollama
  model: qwen3:30b
settings:
  mcpConfigPath: /home/aaugus11/Documents/mcp-client-example/mcp_config_remap.json
  maxIterations: 100
  clearContextBetweenPhases: true
systemPrompt: "@insert-prompt:Prompts__system_context"
tools:
  deny:
  - mcp-tools-orchestrator__execute_composed_code
hooks:
- before: isaac-sim__restore_scene_state
  run: "@tool-exec:ros-mcp-server__move_home(mode='sim')"
phases:
- name: Disassembly sequence discovery
  onStart:
  - "@tool-exec:ros-mcp-server__set_task_phase(phase='disassembly')"
  - "@tool-exec:isaac-sim__new_stage()"
  - "@wait:0.5"
  - "@tool-exec:isaac-sim__quick_start()"
  - "@tool-exec:ros-mcp-server__move_home(mode='sim')"
  - "@tool-exec:ros-mcp-server__control_gripper(command='open', mode='sim')"
  - "@tool-exec:isaac-sim__add_objects(assembly='fmb2')"
  - "@tool-exec:isaac-sim__setup_pose_publisher()"
  - "@wait:1"
  - "@tool-exec:isaac-sim__assemble_objects(assembly='fmb2')"
  - "@insert-resource:Resources__assembly_objects(assembly_id='fmb_assembly_2')"
  commands:
  - "@insert-prompt:Prompts__phase_1_disassembly_sequence_discovery(grasp_hint='enabled')"
  - "@insert-attachment:fmb_assembly2_manual.png"
  hooks:
  - after: ros-mcp-server__verify_disassembly
    run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 1
      status: success
    run: "@complete-phase"
  - after: ros-mcp-server__signal_phase_complete
    whenOutput:
      phase: 1
      status: failure
      requires_response: false
    run: "@escalate"
