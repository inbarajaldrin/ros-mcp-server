name: fmb2_defective_early
description: "Main: Phase 3 sim with defective part replacement — early object inverted_u_brown (order 2, fmb2)"
created: 2026-02-23T00:00:00.000Z
runs: 3
models:
  - provider: anthropic
    model: claude-sonnet-4-6
settings:
  mcpConfigPath: /home/aaugus11/Documents/mcp-client-example/mcp_config.json
  maxIterations: 150
hooks:
  - before: isaac-sim__restore_scene_state
    run: "@tool-exec:ros-mcp-server__move_home(mode='sim')"
phases:
  - name: Assembly execution (sim) + defective part replacement (early)
    onStart:
      - "@tool-exec:isaac-sim__randomize_object_poses()"
      - "@insert-resource:Resources__assembly_objects(assembly_id='fmb_assembly_2')"
    commands:
      - "@insert-prompt:Prompts__phase_3_perform_assembly(mode='sim')"
      - "@insert-attachment:fmb_assembly2_manual.png"
      - "@insert-resource:Resources__results_resource(assembly_id='fmb_assembly_2', task_type='disassembly')"
      - "@insert-resource:Resources__results_resource(assembly_id='fmb_assembly_2', task_type='assembly')"
    hooks:
      - after: ros-mcp-server__verify_assembly
        run: "@tool-exec:ros2-video-recorder__capture_camera_image(topic_name='/workspace_camera_sim')"
      - after: ros-mcp-server__verify_assembly
        whenOutput:
          result: success
          object_name: hex_red
        run: "@insert-prompt:Prompts__replace_defective_part(object_name='inverted_u_brown', base_name='base2')"
      - after: ros-mcp-server__signal_operator
        whenInput:
          message: "*"
        gate:
          run: "@tool-exec:ros-mcp-server__verify_disassembly(object_name='inverted_u_brown', base_name='base2', mode='sim')"
          whenOutput:
            result: success
          onPass:
            - "@tool-exec:isaac-sim__randomize_single_object(object_name='inverted_u_brown')"
            - "@insert-prompt:The defective part inverted_u_brown has been replaced. Continue with assembly."
          onFail:
            - "@insert-prompt:inverted_u_brown has not been disassembled yet. Disassemble it and signal the operator again."
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 3
          status: success
        run: "@complete-phase"
      - after: ros-mcp-server__signal_phase_complete
        whenOutput:
          phase: 3
          status: failure
          requires_response: false
        run: "@abort"
