# MEASURED_CELL.yaml - the real UR5e + RG2 FMB1 cell, as measured (2026-10-24, cell PC "OptiPlex").
#
# Every fact: value, frame, source, status.
#   status  measured    read off the real cell: a live topic, a run log the cell printed, or a physical measurement
#                       recorded in code/notes with its method
#           derived     computed from measured facts by a stated formula (the formula is in `how`)
#           definition  true by construction of a frame/convention, not a measurement
#           UNMEASURED  nobody measured it; `measure_by` says what would
# Paths: repo = /home/aldrin/Documents/ros-mcp-server-verified ; ws = ~/Desktop/ros2_ws/src ;
#        mem = ~/.claude/projects/-home-aldrin-Documents-ros-mcp-server-verified/memory ;
#        evidence/ = this pack's evidence dir (tools/ wrote it, read-only probes).
# Units: m, rad unless a key says _mm / _deg. Quaternions xyzw unless a key says wxyz.
# Frames:
#   ur_base     UR `base` (DH base). Every cell log, VisionPose, cell_layout.yaml, /tcp_pose_broadcaster/pose.
#   base_link   ur_base turned pi about z (the twin's robot root, RViz fixed frame on the cell).
#   twin_world  the table-top plane, origin directly under base_link, axes = base_link axes (the twin/pack world).
#   cell_tf_world  the frame named `world` on the cell's LIVE /tf_static. It is NOT twin_world (see frames.cell_tf_world).

schema: realcell-measured-facts/0      # this pack's own layout, not a platform schema
cell: fmb1_realcell
written_on: '2026-10-24'
written_by: claude (read-only session on the cell PC; no motion, no service calls that move anything)

frames:
  ur_base_to_base_link:
    value: {xyz: [0, 0, 0], quat_xyzw: [0, 0, 1, 0]}         # pi about z
    frame: base_link -> ur_base
    source: live /tf_static (base_link -> base) read 2026-10-24 09:0x; repo CLAUDE.md:100 ("UR base rotated 180 deg about z")
    status: measured
  base_link_above_table:
    value: 0.080
    frame: twin_world z of base_link origin
    source: >-
      repo primitives/shared/config.py:3 ROBOT_BASE_Z = 0.08 (and :5 TABLE_HEIGHT = -0.08 in ur_base);
      Vention Fusion design VentionAssembly_393251_v81.1: robot plate top 880.25 mm vs table panel 799.77 mm = 80.48 mm
      (mem camera-calibration-2026-10-13.md); operator decision 2026-10-23: 0.080 m
    status: measured   # design-CAD gap 80.48 mm, code value 80.0 mm; the 0.48 mm is not used anywhere
    note: >-
      mem staging-layout-tipping.md says "the cell's base is 82 mm above the table" - contradicts both; not used by code.
      ChArUco boards solved ~4 mm above the table in the 10-13 hand-eye (a perception residual, not a mount measurement).
  ur_base_to_twin_world:
    value:
      position: "p_world = (-x_base, -y_base, z_base + 0.080)"
      orientation: "q_world = Rz(pi) * q_base ; xyzw: (qx,qy,qz,qw)_world = (-qy, qx, qw, -qz) ; yaw_world = yaw_base + 180 deg"
    frame: ur_base -> twin_world
    source: derived from frames.ur_base_to_base_link + frames.base_link_above_table
    status: derived
  twin_world_definition:
    value: "origin = the point on the table-top plane directly below base_link's origin; axes = base_link's"
    source: elevated dimelab declaration comment (dimelab_env_elevated/elevated/.../declaration.yaml:15-24); operator 2026-10-23
    status: definition
  cell_tf_world:
    value: {parent: world, child: base_link, xyz: [0, 0, 0], quat_xyzw: [0, 0, 0, 1]}
    source: live /tf_static (world -> base_link) 2026-10-24
    status: measured
    note: >-
      The cell's own TF `world` IS base_link (identity), i.e. 0.080 m ABOVE twin_world. Any consumer that reads `world`
      off the real cell's /tf gets base_link. The adapter must publish twin_world (or rename) - OWED.md.
  objects_stream_parent_label:
    value: "World"     # header.frame_id on /objects_poses_real and its relay /objects/poses
    frame_values_are_in: ur_base
    source: ws aruco_camera_localizer/aruco_camera_localizer/localizer_bridge.py:183; live echo 2026-10-24 (base1 at x 0.135, y -0.466, z -0.0625)
    status: measured
  quaternion_order:
    value: "cell: xyzw everywhere (VisionPose geometry_msgs/Pose, logs, last_base_pose.json, assembly JSONs). twin: layouts/task quat_wxyz, declaration rpy, TF xyzw"
    source: repo seams/vision_server.py:66; twin task.yaml:109; briefing 1.1
    status: definition

