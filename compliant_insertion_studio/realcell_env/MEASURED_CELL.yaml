perception:
  localizer_stream:
    value: {topic: /objects_poses_real, relay: /objects/poses, raw_pre_snap: /objects_poses_real_raw, type: tf2_msgs/msg/TFMessage,
            rate_hz: 2.6, gap_s_max: 0.48, message_shape: "one TFMessage per processed frame, carrying every object in view",
            children_names: "cell names (base1, u_brown, u_orange, line_green, inverted_u_yellow)", parent_label: World, values_in: ur_base}
    source: "live probe evidence/topic_rates_20261024_090532.json (arm still at home, 3 objects in view); seams/vision_server.py:52-54 (relay)"
    status: measured
    other_reports: "mem optiplex-cell-quirks.md ~3.6 Hz; replay comment 'the localizer's ~2.3 Hz' (ablations/replay_real_assembly.py:561); repo CLAUDE.md:25 ~3 Hz"
  coverage:
    value: >-
      only what is in the wrist camera's view: from home it cannot see the clear area; over the clear area it cannot see the
      table parts; a part directly under half-closed fingers is hidden; a horizontal gripper sees no table. In 342 of 419
      sequence-planner observations the part was seen; inverted_u_yellow was 'not seen from any view' or 'observe failed' 56
      times, line_green 8, u_orange 8, u_brown 5 (the arm then looks straight at it, or the recorded sequence is used).
    source: "repo CLAUDE.md:156-157,239-243; /tmp/fmb1_*.log '[derive-sequence]' lines (115 logs)"
    status: measured
  motion_pause: {value: "no detections while the TCP moves > 15 mm/s (holdover 0 frames)", source: "ws aruco_camera_localizer/config/filter_config.yaml:45-47", status: definition}
  z_snap:
    value: >-
      published z is SNAPPED, not measured: objects to table_z + face_height/2 when within 10 mm (object_snap_z), boards to
      table_z + height/2 and yaw-only (board_snap_z, board_yaw_only); parts slide along the camera ray to rest height (within 50 mm).
      Seen live 2026-10-24: u_brown and u_orange SEATED in base1 published at z -0.045 (the table-resting value) although the
      seated centre is ~-0.0415.
    source: "ws aruco_camera_localizer/config/filter_config.yaml:19-29; live /objects_poses_real echo 2026-10-24"
    status: measured
  fold_snap: {value: "orientation snapped to one canonical branch of the part's symmetry group per frame (subtypes block, peg; skipped over 10 deg tilt)", source: "filter_config.yaml:39-42; mem fold-symmetry-logic.md", status: definition}
  ema: {value: off, source: "filter_config.yaml:12", status: definition}
  still_rule: {value: "a pose counts only if the TCP was still 0.8 s before it was published; >= 3 still samples, median", source: "seams/vision_ops.py:34,112-119; repo CLAUDE.md:252-257", status: definition}
  base_view_detection_sets: {value: "from the 0.56 m base view the localizer sits in one of two marker sets for minutes; base1 read steps ~8 mm in y", source: "mem base-view-detection-sets.md", status: measured}
