# --------------------------------------------------------------------------------- layouts
layouts:
  regime: generated
  rest_claim: seated
  # witness: run 78's base1 read (2026-10-23 21:57 MST, 4/4 certified), UR (0.1066, -0.4892) yaw 21.44 deg ->
  # world (-0.1066, 0.4892), yaw 201.44 deg; graph-assembly yaw = world yaw + 90 deg through the cell->graph frame map
