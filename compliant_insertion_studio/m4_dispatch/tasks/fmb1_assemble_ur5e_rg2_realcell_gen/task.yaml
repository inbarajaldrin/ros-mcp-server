  # witness_only: Body1 is drawn, so nothing is placed from this.
  world_from_assembly: {witness_only: true, frame: world, xyz_m: [-0.1066, 0.4892, 0.0], quat_wxyz: [0.82629, 0.0, 0.0, -0.56324], support: work_table}
