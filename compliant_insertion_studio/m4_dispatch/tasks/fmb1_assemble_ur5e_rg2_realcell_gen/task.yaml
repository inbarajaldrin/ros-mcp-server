    # WORLD x [0.2636, 0.3764], y [0.4436, 0.5564]: the cell's clear area +- 56.4 mm
    reorient:   {anchor: {environment_node: work_table, feature: top_surface}, geometry: {kind: rectangle_2d, x_m: [0.2636, 0.3764], y_m: [-0.0549, 0.0579]}, subject_predicate: complete_body_inside}
  free: [occurrence:00, occurrence:01, occurrence:02, occurrence:03, occurrence:04]   # Body1 FREE (control and flat_gen: static)
  static: []
  domains:
    # Body1: drawn in the measured base area; yaw free because the cell's reset turns it to a new yaw each cycle
