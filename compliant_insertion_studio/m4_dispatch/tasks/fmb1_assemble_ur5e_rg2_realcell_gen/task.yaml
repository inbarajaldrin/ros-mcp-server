# ---------------------------------------------------------------------------------- prompt
prompt:
  platform: {name: platform, sha256: de728a1dbf10ac3e89b6d1f82c3cef05ea71fc16b88031daaa650d6f141bd56c}   # current @ 538bbeee (verified 2026-10-26)
  domain: {name: assembly, sha256: d6be4fa5ba7cca3164d3d549b3c92f7c891e724870dfc31e7c941227a30d25b4}     # current @ 538bbeee (verified 2026-10-26)
  # The exceptional instruction this dispatch exists for (M4: the delivered planner runs on the real UR5e + RG2 cell
  # with ONE substitution). Only what the structured declaration cannot say.
  task_layer: >-
    M4 transfer requirement. This planner will be run on a real UR5e + RG2 cell with exactly one substitution, so
    structure it as follows. (1) Every insertion of a mover into its seat is performed by exactly one function,
    insert_mate(mate_id, reference_pose, held_pose), where reference_pose is the reference part's (Body1's) pose read
    from /objects/poses immediately before the call and held_pose is the held mover's pose expressed in the tool frame;
    no other code moves the arm within 30 mm above a seat. On the real cell this one function is replaced by a
    force-controlled insertion action with the same inputs and a {seated, stage_reached} result, so make every
    decision after an insertion depend only on that result and on a fresh read of the scene. (2) Body1 is free and
    its pose differs on every episode: read it from /objects/poses before every mate, never from the layout, and
    aim each subsequent mate from the pose read after the previous one. (3) Read a mover's pose once per grasp, right
    before closing the gripper, and carry that held pose forward (chain it through every reorientation) instead of
    re-reading it while it is held - on the real cell the held part is occluded. (4) When a part must be set down
    and regrasped, use the reorient region.

