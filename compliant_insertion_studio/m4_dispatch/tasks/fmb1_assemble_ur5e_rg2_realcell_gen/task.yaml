    base_start: {anchor: {environment_node: work_table, feature: top_surface}, geometry: {kind: rectangle_2d, x_m: [-0.268, 0.020], y_m: [-0.1715, 0.1305]}, subject_predicate: complete_body_inside}
    # WORLD x [-0.62, -0.293], y [0.25, 0.62]: the cell's staging region, its +x edge 25 mm clear of base_start
