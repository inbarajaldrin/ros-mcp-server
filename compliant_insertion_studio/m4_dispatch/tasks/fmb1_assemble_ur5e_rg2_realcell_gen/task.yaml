    occurrence:01: {region: staging, stance: {quat_wxyz: [0.7071067811865476, 0.0, -0.7071067811865476, 0.0]}, yaw: free, flip: free, rest: settled}   # Body2
    occurrence:02: {region: staging, yaw: free, flip: free, rest: settled}   # Body3
    occurrence:03: {region: staging, stance: {quat_wxyz: [0.7071067811865476, 0.0, -0.7071067811865476, 0.0]}, yaw: free, flip: free, rest: settled}   # Body4
    occurrence:04: {region: staging, stance: {quat_wxyz: [0.7071067811865476, 0.0, -0.7071067811865476, 0.0]}, yaw: free, flip: free, rest: settled}   # Body5
